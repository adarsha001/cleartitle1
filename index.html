    const urlParams = new URLSearchParams(window.location.search);

    let finalSearchEngine = null;
    
    // Priority: UTM Source > Detected Engine > Referrer Analysis
    if (utmSource && isSearchEnginePattern(utmSource)) {

        const searchPatterns = ['google', 'bing', 'yahoo', 'duckduckgo', 'yandex', 'baidu', 'search', 'organic'];

        const hostname = url.hostname.toLowerCase();

        if (hostname.includes('search.')) return 'search_engine';
        if (hostname.includes('google')) return 'google';
        if (hostname.includes('bing')) return 'bing';
        if (hostname.includes('yahoo')) return 'yahoo';
        if (hostname.includes('duckduckgo')) return 'duckduckgo';
        if (hostname.includes('yandex')) return 'yandex';
        if (hostname.includes('baidu')) return 'baidu';
        
        // Check for search parameters
        const params = new URLSearchParams(url.search);
        if (params.has('q') || params.has('query') || params.has('search')) {
            return 'unknown_search_engine';
        }
        
        return 'referral';
    }

    function extractSearchTerm(referrerUrl, urlParams) {
        let term = '';
        
        // Try to get from URL parameters first
        const searchParamKeys = ['q', 'query', 'search', 'p', 'text', 'keyword', 'searchterm', 'search_query', 'search_terms'];
        
        for (const key of searchParamKeys) {
            const value = urlParams.get(key);
            if (value && value.trim()) {
                term = decodeURIComponent(value);

            }
        }
        
        // If not found in current URL, try to extract from referrer

            try {
                const referrerUrlObj = new URL(referrerUrl);
                const referrerParams = new URLSearchParams(referrerUrlObj.search);

            } catch (e) {

        return term.trim();
